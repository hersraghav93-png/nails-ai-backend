# Render Infrastructure-as-Code Blueprint
# Nails by Divya — Staging Environment (Phase 4A.1)
# API Host: staging-api.nailsbydivya.store
# Database: nailsbydivya-staging-db (PostgreSQL 16)

version: "1"

services:
  - type: web
    name: nails-ai-backend-staging
    runtime: node
    plan: starter
    region: singapore
    branch: feature/phase-4a-staging-integration
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    domains:
      - staging-api.nailsbydivya.store
    envVars:
      # Application Environment
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"

      # PostgreSQL Staging Connection (Auto-wired from database resource)
      - key: DATABASE_URL
        fromDatabase:
          name: nailsbydivya-staging-db
          property: connectionString

      # CORS Strict Allowlist for Staging (Strictly isolated: production and localhost origins prohibited)
      - key: ALLOWED_ORIGINS
        value: https://staging.nailsbydivya.store,https://staging-admin.nailsbydivya.store,https://preview.nailsbydivya.store
      - key: CORS_ORIGIN
        value: https://staging.nailsbydivya.store,https://staging-admin.nailsbydivya.store,https://preview.nailsbydivya.store
      - key: CORS_CREDENTIALS
        value: "true"

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: ADMIN_RATE_LIMIT_MAX
        value: "100"
      - key: BROWSE_RATE_LIMIT_MAX
        value: "300"

      # Meta WhatsApp Cloud API (v26.0 - secrets managed securely in Render dashboard)
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v26.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_APPROVED_RECIPIENTS
        sync: false

      # Firebase Admin Staging Credentials (service account secret values managed in Render dashboard)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # Administrative Operations & Auth
      - key: ADMIN_PHONE_ALLOWLIST
        sync: false
      - key: ADMIN_INVITE_SECRET
        sync: false

databases:
  - name: nailsbydivya-staging-db
    plan: starter
    databaseName: nailsbydivya_staging
    user: nailsbydivya_staging_user
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: [] # Private network access by default; allow operator IPs as needed
